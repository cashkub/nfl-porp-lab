name: NFL Shared Engine CI

on:
  push:
    branches: [codex/nfl-shared-engine-upgrade]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-shared-engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run JavaScript tests
        run: npm test
      - name: Build the production frontend bundle
        run: npm run build
      - name: Run Python model and ingestion tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
