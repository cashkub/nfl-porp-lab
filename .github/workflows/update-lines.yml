name: Update sportsbook lines
on:
  push:
    branches: [main]
    paths: ['scripts/update_lines.py', '.github/workflows/update-lines.yml']
  workflow_dispatch:
  schedule:
    - cron: '43 */4 * * *'
permissions:
  contents: write
concurrency:
  group: update-nfl-stats
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch upcoming NFL props
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/update_lines.py
      - name: Publish sportsbook snapshot and track picks
        run: |
          cp public/data/lines.json "$RUNNER_TEMP/draftkings-snapshot.json"
          git restore -- public/data/lines.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main FETCH_HEAD
            git restore --source=HEAD --staged --worktree public/data/lines.json public/data/nfl-picks.json
            cp "$RUNNER_TEMP/draftkings-snapshot.json" public/data/lines.json
            node scripts/track_picks.mjs nfl
            git add public/data/lines.json public/data/nfl-picks.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: refresh DraftKings pregame prop lines"
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
