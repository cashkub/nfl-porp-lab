name: Update sportsbook lines
on:
  push:
    branches: [main]
    paths: ['scripts/update_lines.py']
  workflow_dispatch:
  schedule:
    - cron: '43 */4 * * *'
permissions:
  contents: write
concurrency:
  group: update-nfl-stats
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch upcoming NFL props
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/update_lines.py
      - name: Track Newly Available Picks
        run: node scripts/track_picks.mjs nfl
      - name: Publish changed lines
        run: |
          git add public/data/lines.json public/data/nfl-picks.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/lines.json
          git commit -m "data: refresh DraftKings pregame prop lines"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
