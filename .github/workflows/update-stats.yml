name: Update NFL Data

on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-stats.yml', 'scripts/update_data.py', 'scripts/nfl_features.py', 'scripts/nfl_context.py', 'scripts/nfl_weights.json', 'scripts/record_nfl.mjs', 'scripts/track_picks.mjs', 'src/lib/projection.js', 'src/lib/topLooksModel.js']
  schedule:
    # Refresh current injuries, rosters, depth charts, and player data every six hours.
    - cron: '25 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nfl-stats
  cancel-in-progress: false

jobs:
  update:
    name: Import nflverse game stats
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test stats importer
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Download weekly player stats
        run: python scripts/update_data.py

      - name: Save pregame forecasts
        run: |
          node scripts/record_nfl.mjs
          node scripts/track_picks.mjs nfl

      - name: Commit and publish changed data
        run: |
          git add public/data/stats.json public/data/model-record.json public/data/nfl-picks.json
          if git diff --cached --quiet; then
            echo "No new player stats — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh NFL player game logs"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
