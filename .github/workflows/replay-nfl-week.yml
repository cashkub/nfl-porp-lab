name: Build NFL V2 historical replay

on:
  push:
    paths:
      - 'scripts/replay_nfl_week.mjs'
      - 'src/lib/topLooksModel.js'
      - '.github/workflows/replay-nfl-week.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recalculate picks from pregame snapshots
        run: node scripts/replay_nfl_week.mjs
      - name: Commit replay archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/nfl-v2-replay.json
          git diff --cached --quiet || git commit -m "data: archive NFL Week 9 V2 replay"
          git push
