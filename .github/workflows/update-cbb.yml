name: Update CBB Box Scores
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update_cbb.py', '.github/workflows/update-cbb.yml']
  schedule:
    - cron: '45 13 * * *'
permissions:
  contents: write
concurrency:
  group: update-cbb-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pyarrow>=18,<24'
      - run: python scripts/update_cbb.py
      - name: Publish Changed Box Scores
        run: |
          git add public/data/cbb
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh college basketball player logs"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
