name: Validate NFL Model Candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-nfl-model.yml'
      - 'scripts/nfl_features.py'
      - 'scripts/train_nfl.py'
      - 'scripts/nfl_ratings.py'
      - 'scripts/elo_backtest.py'
      - 'scripts/backtest_player_baselines.py'
      - 'scripts/download_nfl_model_data.py'
      - 'tests/test_nfl_backtest.py'
      - 'tests/test_nfl_data_downloader.py'
      - 'tests/test_nfl_features.py'
      - 'tests/test_elo_backtest.py'
      - 'tests/test_player_backtest.py'
      - 'tests/test_team_ratings.py'
      - 'src/**'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: nfl-model-candidate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the V2 website
        run: npm install --no-package-lock --no-audit --no-fund && npm run build

      - name: Run offline model and data tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Download public nflverse history
        run: python scripts/download_nfl_model_data.py --output-dir data/nfl-model --refresh

      - name: Fit and evaluate a candidate without changing production weights
        run: python scripts/train_nfl.py data/nfl-model scripts/nfl_weights.candidate.json > /tmp/nfl-score-candidate.log

      - name: Evaluate an independent Elo win probability benchmark
        run: python scripts/elo_backtest.py data/nfl-model/games.csv > scripts/elo.candidate.json

      - name: Benchmark player baselines without creating production picks
        run: python scripts/backtest_player_baselines.py data/nfl-model > scripts/player-projections.candidate.json

      - name: Publish evaluation summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('scripts/nfl_weights.candidate.json').read_text())
          elo=json.loads(Path('scripts/elo.candidate.json').read_text())
          player=json.loads(Path('scripts/player-projections.candidate.json').read_text())
          backtest=report['backtest']
          lines=['## NFL Model Candidate Evaluation', '', f"{backtest['protocol']}", '',
                 f"**Samples:** {report['games']} eligible games in the untouched holdout.", '',
                 '**Holdout metrics**', '',
                 '| Model | Score MAE | Margin MAE | Total MAE | Winner Accuracy | Win Brier | Win Log Loss |',
                 '| --- | ---: | ---: | ---: | ---: | ---: | ---: |']
          for name,metrics in backtest['holdout'].items():
              lines.append(f"| {name} | {metrics['scoreMAE']} | {metrics['marginMAE']} | {metrics['totalMAE']} | {metrics['winnerAccuracy'] if metrics['winnerAccuracy'] is not None else '—'} | {metrics.get('winBrier','—')} | {metrics.get('winLogLoss','—')} |")
          lines.extend(['', backtest['marketNote'], '', backtest['weatherNote'], '', backtest['quarterbackNote'], '',
                        'Candidate weights remain an artifact for review; this workflow never updates production `nfl_weights.json`.'])
          lines.extend(['', '## Independent Elo Win Probability Benchmark', '', elo['marketNote'], '',
                        '| Calibration season | Holdout season | N | Elo Brier | Elo log loss | Elo accuracy | Closing ML Brier | Closing ML log loss | Closing ML accuracy |',
                        '| ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |'])
          for fold in elo['folds']:
              e,m=fold['elo'],fold['closingMoneyline']
              lines.append(f"| {fold['calibrationSeason']} | {fold['holdoutSeason']} | {e['games']} | {e['brier']} | {e['logLoss']} | {e['winnerAccuracy']} | {m['brier']} | {m['logLoss']} | {m['winnerAccuracy']} |")
          lines.extend(['', '## Player Projection Baseline Benchmark', '', player['protocol'], '',
                        f"**Player-game rows:** {player['eligiblePlayerGames']}; **completed games:** {player['completedGames']}", '',
                        '| Position / market / baseline | Player-game forecasts | MAE | RMSE |',
                        '| --- | ---: | ---: | ---: |'])
          for key,metrics in player['aggregate'].items():
              lines.append(f"| {key} | {metrics['games']} | {metrics['mae']} | {metrics['rmse']} |")
          lines.extend(['', '**Opportunity baseline by season**', '',
                        '| Position / market | Eligible seasons (n ≥ 50) | Beats season average | Beats recent average |',
                        '| --- | ---: | ---: | ---: |'])
          for key,metrics in player['seasonConsistency'].items():
              lines.append(f"| {key} | {metrics['eligibleSeasons']} | {metrics['beatsSeasonAverage']} | {metrics['beatsRecentAverage']} |")
          lines.extend(['', 'These are historical benchmark baselines, not production projections or betting probabilities. The report artifact includes results by season.'])
          Path('/tmp/nfl-model-summary.md').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(Path('/tmp/nfl-model-summary.md').read_text())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nfl-model-candidate-${{ github.run_id }}
          path: |
            scripts/nfl_weights.candidate.json
            scripts/elo.candidate.json
            scripts/player-projections.candidate.json
          if-no-files-found: error
          retention-days: 14
