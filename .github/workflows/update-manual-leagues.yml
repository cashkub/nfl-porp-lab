name: Daily NBA and CFB Stats
on:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * *'
  push:
    branches: [main]
    paths: ['scripts/update_league.py', '.github/workflows/update-manual-leagues.yml']
permissions:
  contents: write
jobs:
  refresh:
    strategy:
      fail-fast: false
      matrix:
        league: [nba, cfb]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: daily-manual-${{ matrix.league }}
      cancel-in-progress: false
    env:
      LEAGUE: ${{ matrix.league }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pyarrow>=18,<24'
      - run: python scripts/update_league.py "$LEAGUE"
      - run: node scripts/track_picks.mjs "$LEAGUE"
      - name: Publish this league
        run: |
          git add "public/data/$LEAGUE" "public/data/$LEAGUE-picks.json" "public/data/$LEAGUE-games-record.json"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh $LEAGUE research"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
