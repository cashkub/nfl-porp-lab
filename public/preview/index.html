<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>League selection · PropBets</title>
  <link rel="icon" href="./assets/mark.svg">
  <link rel="stylesheet" href="./league.css">
  <link rel="stylesheet" href="./brand.css">
  </head>
<body>
  <main>
    <header><a class="pb-brand" href="./" aria-label="PropBets preview home"><img src="./assets/mark.svg" alt=""><span class="pb-wordmark">Prop<span>Bets</span></span></a></header>
    <h1>Choose your <em>league.</em></h1>
    <div class="leagues">
      <a class="frame nfl" href="./nfl/"><strong><span class="sr-only">NFL</span><span aria-hidden="true" class="glyph">N</span><span aria-hidden="true" class="glyph">F</span><span aria-hidden="true" class="glyph">L</span></strong><span class="cue" aria-hidden="true">↗</span></a>
      <details class="frame nba"><summary aria-label="NBA coming soon. Show current tools"><strong><span class="sr-only">NBA</span><span aria-hidden="true" class="glyph">N</span><span aria-hidden="true" class="glyph">B</span><span aria-hidden="true" class="glyph">A</span></strong><span class="coming-soon">COMING SOON</span><span class="cue" aria-hidden="true">+</span></summary><a class="shortcut" href="../#nba-home">Current NBA tools ↗</a></details>
      <details class="frame cfb"><summary aria-label="CFB coming soon. Show current tools"><strong><span class="sr-only">CFB</span><span aria-hidden="true" class="glyph">C</span><span aria-hidden="true" class="glyph">F</span><span aria-hidden="true" class="glyph">B</span></strong><span class="coming-soon">COMING SOON</span><span class="cue" aria-hidden="true">+</span></summary><a class="shortcut" href="../#cfb-home">Current CFB tools ↗</a></details>
      <details class="frame cbb"><summary aria-label="CBB coming soon. Show current tools"><strong><span class="sr-only">CBB</span><span aria-hidden="true" class="glyph">C</span><span aria-hidden="true" class="glyph">B</span><span aria-hidden="true" class="glyph">B</span></strong><span class="coming-soon">COMING SOON</span><span class="cue" aria-hidden="true">+</span></summary><a class="shortcut" href="../#cbb-home">Current CBB tools ↗</a></details>
    </div>
  </main>
</body>
</html>
