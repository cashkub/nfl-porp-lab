<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>League selection · PropBets</title>
  <link rel="icon" href="./assets/mark.svg">
  <link rel="stylesheet" href="./league.css">
  <link rel="stylesheet" href="./brand.css">
  </head>
<body>
  <main>
    <header><a class="pb-brand" href="./" aria-label="PropBets preview home"><img src="./assets/mark.svg" alt=""><span class="pb-wordmark">Prop<span>Bets</span></span></a></header>
    <h1>Choose your <em>league.</em></h1>
    <div class="leagues">
      <a class="frame nfl" href="./nfl/"><strong class="glyph">NFL</strong><span class="league-status">Live · In testing</span><span class="cue" aria-hidden="true">↗</span></a>
      <a class="frame cbb" href="./cbb/"><strong class="glyph">CBB</strong><span class="league-status">Live · In testing</span><span class="cue" aria-hidden="true">↗</span></a>
      <div class="frame nba"><strong class="glyph">NBA</strong><span class="league-status">Coming later</span></div>
      <div class="frame cfb"><strong class="glyph">CFB</strong><span class="league-status">Coming later</span></div>
    </div>
  </main>
</body>
</html>
