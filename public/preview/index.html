<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>League selection · PropBets</title>
  <link rel="icon" href="./assets/mark.svg">
  <link rel="stylesheet" href="./league.css">
</head>
<body>
  <main>
    <header><a class="brand" href="./" aria-label="PropBets preview home"><img src="./assets/mark.svg" alt=""><span class="wordmark">Prop<span>Bets</span></span></a><a class="return" href="../#home">Current site ↗</a></header>
    <h1>Choose your <em>league.</em></h1>
    <div class="leagues">
      <a class="frame nfl" href="./nfl/"><strong>NFL</strong><span class="cue" aria-hidden="true">↗</span></a>
      <details class="frame cfb"><summary aria-label="CFB preview coming later. Show current tools"><strong>CFB</strong><span class="cue" aria-hidden="true">+</span></summary><a class="shortcut" href="../#cfb-home">Current CFB tools ↗</a></details>
      <details class="frame nba"><summary aria-label="NBA preview coming later. Show current tools"><strong>NBA</strong><span class="cue" aria-hidden="true">+</span></summary><a class="shortcut" href="../#nba-home">Current NBA tools ↗</a></details>
      <details class="frame cbb"><summary aria-label="CBB preview coming later. Show current tools"><strong>CBB</strong><span class="cue" aria-hidden="true">+</span></summary><a class="shortcut" href="../#cbb-home">Current CBB tools ↗</a></details>
    </div>
  </main>
</body>
</html>
