<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" fill="none">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0v25" stroke="#b9d9ff" opacity=".09"/>
    </pattern>
    <pattern id="yards" width="60" height="320" patternUnits="userSpaceOnUse">
      <path d="M0 0v320m30-320v320" stroke="#7cdfff" stroke-width="1.4"/>
      <path d="M6 130v5m6-5v5m6-5v5m6-5v5m12-5v5m6-5v5m6-5v5m6-5v5M6 185v5m6-5v5m6-5v5m6-5v5m12-5v5m6-5v5m6-5v5m6-5v5" stroke="#a4eeff" stroke-width="2"/>
    </pattern>
    <filter id="glow" x="-12%" y="-15%" width="124%" height="130%">
      <feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="numbers" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#aeeeff">
      <text x="60" y="291">10</text><text x="120" y="291">20</text><text x="180" y="291">30</text><text x="240" y="291">40</text><text x="300" y="291">50</text><text x="360" y="291">40</text><text x="420" y="291">30</text><text x="480" y="291">20</text><text x="540" y="291">10</text>
    </g>
    <g id="field">
      <rect x="-60" width="720" height="320" stroke="#8fe5ff" stroke-width="2.5"/>
      <rect width="600" height="320" fill="url(#yards)" stroke="#a8f1ff" stroke-width="2"/>
      <use xlink:href="#numbers"/><use xlink:href="#numbers" transform="translate(600 320) rotate(180)"/>
      <path d="M98 235h73l70-74h50m-12-10 13 10-13 10" stroke="#c5f7ff" stroke-width="2.5" stroke-dasharray="7 5"/>
      <circle cx="89" cy="235" r="6" stroke="#c5f7ff" stroke-width="2"/>
    </g>
    <g id="key" stroke="#caaeff" stroke-width="2">
      <path d="M0 24h46a141 141 0 0 1 0 272H0M0 112h114v96H0"/>
      <circle cx="114" cy="160" r="36"/><path d="M24 142v36m8-42a24 24 0 0 1 0 48"/>
      <circle cx="32" cy="160" r="5"/>
    </g>
    <g id="court" stroke="#cfb5ff" stroke-width="2">
      <rect width="600" height="320"/><path d="M300 0v320"/><circle cx="300" cy="160" r="38"/>
      <use xlink:href="#key"/><use xlink:href="#key" transform="translate(600 320) rotate(180)"/>
    </g>
  </defs>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <g filter="url(#glow)" opacity=".56"><use xlink:href="#field" transform="translate(-155 126) rotate(-16) scale(.86)"/></g>
  <g filter="url(#glow)" opacity=".46"><use xlink:href="#court" transform="translate(808 -112) rotate(18) scale(1.04)"/></g>
  <g filter="url(#glow)" opacity=".50"><use xlink:href="#court" transform="translate(667 485) rotate(-15) scale(.9)"/></g>
  <g filter="url(#glow)" opacity=".45"><use xlink:href="#field" transform="translate(-215 643) rotate(12) scale(.85)"/></g>
</svg>
